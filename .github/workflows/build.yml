name: Build Melodix APK



on:

  push:

    branches: [ main, master ]

    tags: [ 'v*' ]

  pull_request:

  workflow_dispatch:



permissions:

  contents: write



jobs:

  build:

    runs-on: ubuntu-latest

    timeout-minutes: 60



    steps:

      - name: Checkout

        uses: actions/checkout@v4



      - name: Set up JDK 17

        uses: actions/setup-java@v5

        with:

          distribution: temurin
